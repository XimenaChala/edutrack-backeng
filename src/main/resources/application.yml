server:
  port: ${PORT:8085}

spring:
  application:
    name: communication-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/communication_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true